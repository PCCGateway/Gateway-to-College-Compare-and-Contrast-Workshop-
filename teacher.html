<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gateway Instructor Recovery Dashboard</title><link rel="stylesheet" href="teacher.css"></head><body><main class="wrap"><header><h1>Instructor Recovery Dashboard</h1><p>Compare & Contrast Workshop · Cloud backup and instructor-assisted restoration</p></header><section class="card" id="signin"><h2>Instructor access</h2><label>Instructor PIN <input type="password" id="pin" inputmode="numeric" autocomplete="off" maxlength="12"></label><button id="login">Unlock dashboard</button><p id="message" role="status"></p></section><section id="private" hidden><div class="card"><button id="refresh">Refresh</button> <button id="logout">Lock dashboard</button><label>Find a student <input id="filter" placeholder="Search by name"></label><p id="summary"></p><div class="scroll"><table><thead><tr><th>Student</th><th>Progress</th><th>First access</th><th>Last access</th><th>Last saved</th><th></th></tr></thead><tbody id="records"></tbody></table></div></div><section id="detail" class="card" hidden><h2 id="studentTitle"></h2><p id="detailMeta"></p><div class="actions"><button id="json">Download resumable JSON</button><button id="print">Print / Save as PDF</button></div><h3>Saved responses</h3><div id="answers"></div></section></section></main><script src="config.js"></script><script src="teacher.js"></script></body></html>
